name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # استنساخ المشروع
    - name: Checkout code
      uses: actions/checkout@v3

    # تثبيت Java 17
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    # بناء APK باستخدام Gradle المثبت على Runner
    - name: Build APK
      run: gradle assembleDebug

    # رفع الـ APK كـ artifact
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ProChan-APK
        path: build/outputs/apk/debug/*.apk
