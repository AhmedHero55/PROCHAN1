name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # استنساخ المشروع
    - name: Checkout code
      uses: actions/checkout@v3

    # تثبيت Java
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '11'

    # إعطاء صلاحيات تنفيذ لـ gradlew
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # بناء APK
    - name: Build APK
      run: ./gradlew assembleDebug

    # رفع الـ APK كـ artifact
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ProChan-APK
        path: build/outputs/apk/debug/*.apk
